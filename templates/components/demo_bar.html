{% load static %}
<!-- Quick Presentation Switcher for SIH 2026 Evaluation -->
<div class="demo-switcher-bar select-none">
  <div class="max-w-7xl mx-auto w-full flex flex-wrap items-center justify-between gap-2 px-2 text-xs">
    <div class="flex items-center gap-2">
      <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-blue-900/60 border border-blue-400/40 text-blue-200 font-semibold tracking-wide">
        <i data-lucide="award" class="w-3.5 h-3.5 text-cyan-300"></i> SIH26130
      </span>
      <span class="hidden sm:inline text-slate-300">Smart India Hackathon 2026 | Govt. of Maharashtra</span>
    </div>
    
    <div class="flex items-center gap-2">
      <span class="text-slate-300 text-[11px] hidden md:inline">Demo Persona Switcher:</span>
      
      <a href="{% url 'accounts:switch_demo' role='entrepreneur' %}" 
         class="px-2.5 py-1 rounded transition-all flex items-center gap-1.5 font-medium {% if is_entrepreneur %}bg-emerald-600 text-white shadow-sm ring-1 ring-emerald-300{% else %}bg-slate-800/80 text-slate-300 hover:bg-slate-700 hover:text-white{% endif %}">
        <i data-lucide="briefcase" class="w-3.5 h-3.5"></i>
        <span>Entrepreneur (Amol Patil)</span>
      </a>

      <a href="{% url 'accounts:switch_demo' role='officer' %}" 
         class="px-2.5 py-1 rounded transition-all flex items-center gap-1.5 font-medium {% if is_officer %}bg-blue-600 text-white shadow-sm ring-1 ring-blue-300{% else %}bg-slate-800/80 text-slate-300 hover:bg-slate-700 hover:text-white{% endif %}">
        <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
        <span>Officer (Dr. Kulkarni)</span>
      </a>

      {% if user.is_authenticated %}
      <a href="{% url 'accounts:logout' %}" class="px-2 py-1 rounded bg-slate-800/60 text-slate-400 hover:text-white hover:bg-red-900/40 text-[11px] transition-colors" title="Log Out to Public Portal">
        <i data-lucide="log-out" class="w-3 h-3 inline"></i> Exit
      </a>
      {% endif %}
    </div>
  </div>
</div>
